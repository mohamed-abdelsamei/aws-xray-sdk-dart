name: Release

# The manual release button: Actions -> "Release" -> Run workflow (on main).
# Releases are never created automatically on merges to main — only by
# running this workflow.
#
# Version resolution:
#   - If pubspec.yaml already holds an unreleased version (no vX.Y.Z tag
#     yet), that version is released as-is — a manual bump wins.
#   - Otherwise the workflow auto-increments the version by the chosen bump
#     level (patch by default), writes it to pubspec.yaml, and commits.
#   Pre-release versions (e.g. 0.5.0-beta.1) always take the manual path:
#   bump pubspec.yaml by hand, then run this workflow.
#
# CHANGELOG: if no `## X.Y.Z` section exists for the release version, one is
# generated from the commit subjects since the last tag. A hand-written
# section always wins — add it before pressing Release for curated notes.
#
# main is protected (pull request required, signed commits required), so
# the workflow cannot push to it. When pubspec/CHANGELOG need a change it
# runs in two passes:
#   1. It commits `chore(release): X.Y.Z` to a `release/vX.Y.Z` branch
#      through the GraphQL API (GitHub signs API-made commits), opens a
#      pull request, and stops. Merge that PR.
#   2. Run Release again. pubspec now holds the unreleased version and the
#      CHANGELOG section exists, so nothing changes: the annotated tag
#      `vX.Y.Z` is pushed and "Publish to pub.dev" is dispatched on it,
#      which runs the rest of the pipeline (test matrix -> GitHub Release
#      -> pub.dev publish).
# When the version and CHANGELOG section are already on main, pass 2 runs
# straight away.
#
# The release PR is opened with GITHUB_TOKEN, so CI does not run on it
# (token-caused events do not trigger workflows). It only touches
# pubspec.yaml and CHANGELOG.md; the test matrix runs again on the tag.
#
# Why the explicit dispatch: a tag pushed with GITHUB_TOKEN cannot trigger
# other workflows (GitHub blocks token-caused push events), but the
# workflow_dispatch API is exempt from that rule — so this workflow starts
# publish.yml directly on the tag ref, which is also what pub.dev's OIDC
# exchange requires.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump when pubspec is already released'
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write # create the release branch/commit and push the tag
  pull-requests: write # open the release PR
  actions: write # dispatch publish.yml

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version, tag, and start publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags + history for version and changelog generation

      - name: Resolve release version
        id: meta
        run: |
          set -euo pipefail
          CURRENT=$(grep '^version:' pubspec.yaml | awk '{print $2}')

          if git ls-remote --tags --exit-code origin "refs/tags/v${CURRENT}" >/dev/null 2>&1; then
            # pubspec version is already released — auto-increment it.
            BASE="${CURRENT%%-*}" # strip any pre-release suffix
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
            case "${{ inputs.bump }}" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              *)     VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
            echo "Auto-incrementing ${CURRENT} -> ${VERSION} (${{ inputs.bump }})."
            sed -i "s/^version: .*/version: ${VERSION}/" pubspec.yaml
          else
            # pubspec holds an unreleased version — release it as-is.
            VERSION="$CURRENT"
            echo "Releasing manually bumped version ${VERSION}."
          fi

          TAG="v${VERSION}"
          if git ls-remote --tags --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Ensure CHANGELOG section
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          if grep -qE "^## ${VERSION}( |$)" CHANGELOG.md; then
            echo "✅ Hand-written '## ${VERSION}' section found."
            exit 0
          fi
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          RANGE=${LAST_TAG:+${LAST_TAG}..HEAD}
          NOTES=$(git log --no-merges --pretty='- %s' ${RANGE:-HEAD})
          if [ -z "$NOTES" ]; then
            echo "::error::No commits since ${LAST_TAG:-the beginning} — nothing to release."
            exit 1
          fi
          # Insert the generated section right below the "# Changelog" header.
          {
            head -n 1 CHANGELOG.md
            echo ""
            echo "## ${VERSION}"
            echo ""
            echo "$NOTES"
            tail -n +2 CHANGELOG.md
          } > CHANGELOG.md.new && mv CHANGELOG.md.new CHANGELOG.md
          echo "✅ Generated '## ${VERSION}' section from commits since ${LAST_TAG:-the first commit}."

      - name: Open release PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "opened=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${{ steps.meta.outputs.version }}"
          BRANCH="release/${{ steps.meta.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch ${BRANCH} already exists. Merge or close its PR and delete the branch, then run Release again."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${BRANCH}" -f sha="$HEAD_SHA" >/dev/null
          # createCommitOnBranch makes a commit GitHub signs, which the
          # signed-commits ruleset accepts.
          base64 -w0 pubspec.yaml > "$RUNNER_TEMP/pubspec.b64"
          base64 -w0 CHANGELOG.md > "$RUNNER_TEMP/changelog.b64"
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg head "$HEAD_SHA" \
            --arg msg "chore(release): ${VERSION}" \
            --rawfile pubspec "$RUNNER_TEMP/pubspec.b64" \
            --rawfile changelog "$RUNNER_TEMP/changelog.b64" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: $msg},
                expectedHeadOid: $head,
                fileChanges: {additions: [
                  {path: "pubspec.yaml", contents: $pubspec},
                  {path: "CHANGELOG.md", contents: $changelog}
                ]}}}}' \
            | gh api graphql --input - >/dev/null
          URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "chore(release): ${VERSION}" \
            --body "Version bump and CHANGELOG section for ${VERSION}, generated by the Release workflow. Merge this, then run **Release** again to tag v${VERSION} and publish.")
          echo "opened=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Opened ${URL}. Merge it, then run Release again to tag and publish ${VERSION}."

      - name: Tag and push
        if: ${{ steps.pr.outputs.opened == 'false' }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release ${VERSION}"
          git push origin "$TAG"
          echo "✅ Tagged ${TAG} at $(git rev-parse --short HEAD)."

      - name: Start publish pipeline on the tag
        if: ${{ steps.pr.outputs.opened == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "::notice::Dispatched 'Publish to pub.dev' on ${TAG} — the pipeline (test -> GitHub Release -> pub.dev) is running."
